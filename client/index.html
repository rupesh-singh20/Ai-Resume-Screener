<!doctype html>
<html lang="en" class="light">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="AIHireX is an AI-powered resume screening, mock interview, and career coaching platform. Optimize your resume for ATS, practice interviews, and accelerate your career with Gemini AI." />
  <meta name="theme-color" content="#ffffff" />
  <title>AIHireX — AI Resume Screener & Career Coaching Platform</title>
  <!-- Force light mode on initial script execution before hydration -->
  <script>
    (function() {
      var saved = localStorage.getItem('aihirex_theme_v2');
      if (saved === 'dark') {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light');
      } else {
        document.documentElement.classList.add('light');
        document.documentElement.classList.remove('dark');
        localStorage.setItem('aihirex_theme_v2', 'light');
      }
    })();
  </script>
  <!-- Outfit & Inter Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
</head>

<body class="bg-slate-50 dark:bg-gray-950 text-slate-900 dark:text-slate-100 min-h-screen font-sans antialiased overflow-x-hidden">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
